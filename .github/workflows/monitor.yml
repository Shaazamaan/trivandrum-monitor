name: Google Maps Monitor

on:
  schedule:
    # Runs every 20 minutes
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allows manual trigger

# CONCURRENCY CONTROL
# Prevents multiple runs from overlapping and corrupting the database.
# If a new run starts while one is running, it will queue (not cancel, to ensure data safety).
concurrency:
  group: scraper-prod
  cancel-in-progress: false

jobs:
  scrape_and_alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the database back
      actions: write  # Needed to start the next run

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Python 3.9 is no longer provided on ubuntu-latest (now Ubuntu 26.04),
      # which made every run fail at this step. 3.12 is current and supported.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CACHING (Gold Standard Speed)
      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit and Push Database
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # Removed 'git pull' to prevent binary conflicts. Concurrency handles serialization.
          git add -f known_places.db data.json
          git add -f metadata.json
          # Only commit if there are changes (i.e. new businesses found)
          git commit -m "Update known places database" || echo "No changes to commit"
          git push

      # GitHub often skips scheduled runs, so each run starts the next one.
      # The cron above stays as a backup to restart the chain if it breaks.
      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main --repo ${{ github.repository }}
